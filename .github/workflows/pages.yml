# ينشر المنصة على GitHub Pages تلقائياً مع كل دفعة.
# enablement: true تُفعّل الاستضافة ذاتياً في أول تشغيل،
# فلا حاجة لأي ضبط يدوي من إعدادات المستودع.
name: نشر المنصة

on:
  push:
    branches: [claude/elegant-cerf-zajooj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تهيئة الاستضافة
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: رفع الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
